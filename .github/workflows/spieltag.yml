name: Bundesliga Spieltag Pipeline

on:
  schedule:
    # Ergebnisse + Marktwerte taeglich um 04:00 UTC aktualisieren
    - cron: "0 4 * * *"
    # Aufstellungen + Vorhersage: stuendlich, jeden Tag (Bundesliga spielt bei
    # englischen Wochen auch Di/Mi, nicht nur Fr-So)
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  tagesaktualisierung:
    if: github.event.schedule == '0 4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Ergebnisse aktualisieren
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/fetch_openligadb.py
      - name: xG-Werte von Understat holen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/fetch_understat_xg.py --saison 2026
      - name: Marktwerte/Kader aktualisieren
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/fetch_transfermarkt.py --sync-kader
      - name: Spielerstatistiken aktualisieren
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/fetch_aufstellungen.py --stats
      - name: Vorlaeufige Aufstellung aus letztem Spiel uebernehmen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/fetch_aufstellungen.py --vorlaeufige-aufstellung
      - name: Vorhersagen mit vorlaeufiger Aufstellung berechnen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/model_poisson.py --tage-voraus 6

  spieltag_live:
    if: github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ergebnisse und Anstosszeiten aktualisieren
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/fetch_openligadb.py
      - name: Aufstellungen pruefen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/fetch_aufstellungen.py --lineups
      - name: Vorhersagen (neu) berechnen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/model_poisson.py --tage-voraus 1
